plugins {
    id 'java'
}

group = 'pl.edu.ur.teachly'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // OpenPDF is required by our custom generator to perform low-level layout and PDF file generation.
    implementation 'com.github.librepdf:openpdf:1.3.38'
}

jar {
    archiveFileName = 'report-library.jar'
    destinationDirectory = file("${rootDir}/build/libs")
}
