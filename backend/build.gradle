plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.4.0'
    id 'checkstyle'
    id 'jacoco'
}

jacoco {
    toolVersion = "0.8.12"
}

group = 'pl.edu.ur'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // Postgres
    runtimeOnly 'org.postgresql:postgresql'
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    // OpenPDF for Reports
    implementation 'com.github.librepdf:openpdf:1.3.38'
    // Custom Local Report Library
    implementation files('libs/report-library.jar')
    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.6')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty(
            'testcontainers.postgres.image',
            findProperty('testcontainersPostgresImage') ?: 'postgres:18-alpine')
    systemProperty(
            'test.jwt.secret-key',
            findProperty('testJwtSecretKey')
                    ?: '404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970')
    systemProperty(
            'test.jwt.expiration',
            findProperty('testJwtExpirationMs') ?: '86400000')
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Automatization when compiling
// 1. Always format code (Spotless)
tasks.named('compileJava') {
    dependsOn 'spotlessApply'
}
// 2. Always check code quality (Checkstyle)
tasks.named('compileJava') {
    finalizedBy 'checkstyleMain'
    finalizedBy 'checkstyleTest'
}

// Spotless
spotless {
    java {
        // AOSP mode consistent with Java Coding Standards
        googleJavaFormat('1.35.0').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        // Exempt files generated by MapStruct / Lombok
        targetExclude('**/generated/**')
    }
}

// Checkstyle
checkstyle {
    toolVersion = '10.17.0'
    configFile = file("config/checkstyle/checkstyle.xml")
    // Warnings don't stop build
    ignoreFailures = false
    // Console violations logging
    showViolations = true
}

// Start Checkstyle with compilation
tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = false
        html.required = true   // HTML report in build/reports/checkstyle/
    }
}
