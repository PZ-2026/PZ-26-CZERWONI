# Test overrides: backend/gradle.properties (testJwtSecretKey, testJwtExpirationMs, testcontainersPostgresImage)
spring.profiles.active=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration,classpath:db/seed
application.security.jwt.secret-key=${test.jwt.secret-key}
application.security.jwt.expiration=${test.jwt.expiration}
logging.file.name=
